name: Build Release APK

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set app version from tag
        env:
          VERSION_NAME: ${{ github.ref_name }}
        run: |
          IFS=. read -r major minor patch <<< "$VERSION_NAME"

          if (( minor > 999 || patch > 999 )); then
            echo "Minor and patch versions must not exceed 999." >&2
            exit 1
          fi

          version_code=$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))
          if (( version_code < 1 || version_code > 2100000000 )); then
            echo "The tag produces an invalid Android versionCode: $version_code" >&2
            exit 1
          fi

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$version_code" >> "$GITHUB_ENV"

      - name: Test and build release APK
        run: >-
          ./gradlew
          :app:testDebugUnitTest
          :app:assembleRelease
          -PreleaseVersionName="$VERSION_NAME"
          -PreleaseVersionCode="$VERSION_CODE"
          --stacktrace

      - name: Name release APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
            "artifacts/SLIder-${VERSION_NAME}-unsigned.apk"

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: SLIder-${{ github.ref_name }}-release-unsigned
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30
